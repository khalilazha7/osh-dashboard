<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Audit Dalaman OSH · FTKE UTeM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#10243E;
    --ink-soft:#1B3A5C;
    --steel:#2C5C86;
    --steel-light:#EAF1F7;
    --paper:#F6F5F1;
    --paper-card:#FFFFFF;
    --line:#DAD5C8;
    --line-soft:#E9E5D9;
    --amber:#C97A2B;
    --amber-bg:#FBF0E1;
    --green:#3F7A55;
    --green-bg:#E9F2EB;
    --red:#B23A2E;
    --red-bg:#FBEAE7;
    --text:#1E2A33;
    --text-mute:#5B6773;
    --radius:10px;
    --solid:#10243E;
    --btn-primary-bg: var(--solid);
  }
  body.scheme-green{
    --ink:#0F3D2E; --ink-soft:#1B5A44; --steel:#2E7D5B; --steel-light:#E7F3ED; --solid:#0F3D2E; --btn-primary-bg:#0F3D2E;
  }
  body.scheme-purple{
    --ink:#2E1A47; --ink-soft:#452768; --steel:#6B4B9E; --steel-light:#F0EBF7; --solid:#2E1A47; --btn-primary-bg:#2E1A47;
  }
  body.scheme-maroon{
    --ink:#4A1620; --ink-soft:#6B2230; --steel:#8B3A4A; --steel-light:#F7EAEC; --solid:#4A1620; --btn-primary-bg:#4A1620;
  }
  body.dark{
    --ink:#EAF0F6;
    --ink-soft:#C9D8E6;
    --steel:#6FAEDD;
    --steel-light:#16293B;
    --paper:#0B1622;
    --paper-card:#101C2B;
    --line:#25384C;
    --line-soft:#1A2839;
    --amber:#E3A85E;
    --amber-bg:#3A2C12;
    --green:#7ACBA0;
    --green-bg:#12301F;
    --red:#E58876;
    --red-bg:#3A1712;
    --text:#DCE6EF;
    --text-mute:#8FA3B8;
    --btn-primary-bg:#6FAEDD; /* Sidebar (--solid) KEKAL gelap - hanya butang dicerahkan supaya kontras jelas dalam mod gelap */
  }
  body.dark .btn.primary{ color:#0B1622; } /* teks gelap pada butang terang supaya kontras jelas dalam mod gelap */

  body.dark.scheme-purple{ --btn-primary-bg:#B08FDE; }
  body.dark.scheme-maroon{ --btn-primary-bg:#E08A9A; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.5;

  }
  #app{
    display:flex;
    min-height:100vh;
    width:100%;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ---- code chip (signature element) ---- */
  .code-chip{
    display:inline-flex;align-items:center;justify-content:center;

  }
  .code-chip.lg{min-width:38px;height:28px;font-size:13px;}
  .code-chip.crit{background:var(--red-bg);color:var(--red);border-color:#F0CFC9;}

  /* ---- sidebar ---- */
  .sidebar{
    width:222px;flex-shrink:0;

  .brand-mark{

  .item-row.crit{border-left:3px solid var(--red);}

  .item-text{font-size:13.5px;color:var(--text);flex:1;}

  /* ---- login screen ---- */
  .login-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .login-card{width:100%;max-width:420px;background:var(--paper-card);border:1px solid var(--line-soft);border-radius:14px;padding:32px 30px;}
  .login-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;}

    display:flex;align-items:center;gap:10px;background:var(--steel-light);border:1px solid #CFE0EC;

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   NOTA: Ini PROTOTAIP DEMO untuk rujukan visual/UX pembangunan
   Power Apps (rujuk dokumen Blueprint). Data tersimpan tempatan
   dalam sesi pelayar sahaja (bukan backend sebenar) - dalam
   Power Apps sebenar nanti, ini digantikan SharePoint Lists
   ikut struktur dalam dokumen Blueprint.
   ============================================================ */

/* ============================================================
   KONFIGURASI BACKEND — WAJIB TUKAR SEBELUM GUNA
   ============================================================
   1. Pasang backend ikut arahan dalam fail worker.js (Cloudflare Worker)
   2. Selepas Deploy, salin URL Worker (cth: https://osh-audit-backend.xxxx.workers.dev)
   3. Tampal URL tu di bawah, gantikan teks 'GANTIKAN_DENGAN_URL_WORKER'
   ============================================================ */
const CONFIG = {
  API_URL: 'https://osh-audit-backend.kaleel83.workers.dev',
};

/* ============ SAMBUNGAN KE BACKEND (Cloudflare Worker) ============ */
async function apiCall(action, data){
  if(CONFIG.API_URL.includes('GANTIKAN_DENGAN')){
    toast('⚠ Backend belum disambung. Sila tetapkan CONFIG.API_URL dalam kod (rujuk arahan worker.js).');
    throw new Error('API_URL belum ditetapkan');
  }
  const token = (currentUser && currentUser.token) ? currentUser.token : null;
  let res, rawText;
  try{
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, token, ...data })
    });
  }catch(networkErr){
    const msg = `Gagal hubungi backend sepenuhnya (kemungkinan rangkaian/URL salah). Butiran: ${networkErr.message}`;
    toast('⚠ ' + msg);
    console.error('apiCall network error:', networkErr);
    return { ok:false, error: msg };
  }
  try{
    rawText = await res.text();
  }catch(readErr){
    toast('⚠ Gagal baca respons daripada backend.');
    return { ok:false, error:'Gagal baca respons: ' + String(readErr) };
  }
  let json;
  try{
    json = JSON.parse(rawText);
  }catch(parseErr){
    const preview = rawText.slice(0, 300);
    const msg = `Backend memulangkan respons bukan-JSON (Status HTTP: ${res.status}). Kandungan sebenar diterima:\n\n${preview}`;
    toast('⚠ Respons backend tidak sah. Sila salin mesej penuh untuk disiasat.');
    showFatalError(new Error(msg), `apiCall("${action}") — Status ${res.status}`);
    return { ok:false, error: msg };
  }
  if(!json.ok){ toast('⚠ ' + (json.error || 'Ralat tidak diketahui daripada backend.')); }
  return json;
}
async function loadAllDataFromBackend(){
  const res = await apiCall('getData', {});
  if(!res.ok) return false;
  USERS.length = 0;
  res.users.forEach(u=> USERS.push({...u, aktif: u.aktif===true || u.aktif==='TRUE' || u.aktif==='true'}));
  STATE.sessions = res.sessions.map(s=>({...s, id:Number(s.id)}));
  STATE.audits = res.audits.map(a=>({...a, id:Number(a.id), sesiId:Number(a.sesiId)}));
  STATE.pendingRegistrations = res.registrations.map(r=>({...r, id:Number(r.id)}));
  const activeSess = STATE.sessions.filter(s=>s.status==='Aktif').sort((a,b)=>b.id-a.id)[0];
  STATE.activeSessionId = activeSess ? activeSess.id : null;
  return true;
}

/* ============ DATA MODEL ============ */
const SECTIONS = [
  {code:'A', title:'Pengurusan & Dokumentasi', items:[
    ['A1','Tanda nama PIC makmal dipamerkan'],
    ['A2','SOP mesin/ alatan makmal yang berisiko tinggi disediakan'],
    ['A3','Dokumen HIRARC terkini disemak, diluluskan dan releven dengan aktiviti makmal'],
    ['A4','Rekod taklimat keselamatan pelajar/penyelidik ada disimpan'],
    ['A5','Rekod penyelenggaraan dan kalibrasi ada disediakan'],
    ['A6','Rekod kemalangan/Near Miss ada disediakan'],
    ['A7','Nombor kecemasan adalah yang terkini'],
    ['A8','Status Tindakan Susulan Audit Terdahulu (Tutup / Belum Tutup)'],
  ]},
  {code:'B', title:'Keadaan Am Makmal', items:[
    ['B1','Lantai & Laluan Berjalan: Kebersihan terjaga, tiada tumpahan minyak/air, dan tiada bahaya tersimpul (trip hazard)'],

function getAllCodes(){ return SECTIONS.flatMap(s=>s.items.map(i=>i[0])); }
function itemText(code){ for(const s of SECTIONS){ for(const i of s.items){ if(i[0]===code) return i[1]; } } return code; }
function sectionOf(code){ return SECTIONS.find(s=>code.startsWith(s.code)); }

/* ============ PENGURUSAN STRUKTUR BORANG 1 (Admin sahaja) ============ */
function nextSectionCode(){
  let charCode = 65; // 'A'
  const used = SECTIONS.map(s=>s.code);
  while(used.includes(String.fromCharCode(charCode)) && charCode < 91) charCode++;
  return String.fromCharCode(charCode);
}
function nextItemCode(sectionCode){
  const sec = SECTIONS.find(s=>s.code===sectionCode);
  if(!sec) return sectionCode+'1';
  let n = 1;
  const existing = sec.items.map(([c])=>c);
  while(existing.includes(sectionCode+n)) n++;
  return sectionCode+n;
}
function adminAddSection(){
  const input = document.getElementById('newSectionTitle');
  const title = input.value.trim();
  if(!title){ toast('Sila masukkan nama bahagian.'); return; }
  const code = nextSectionCode();
  SECTIONS.push({code, title, items:[]});
  input.value = '';
  toast(`Bahagian ${code}. ${title} ditambah. Sila tambah sekurang-kurangnya satu item.`);
  renderAdmin();
}
function adminUpdateSectionTitle(code, newTitle){
  const sec = SECTIONS.find(s=>s.code===code);
  if(sec && newTitle.trim()){ sec.title = newTitle.trim(); toast(`Tajuk Bahagian ${code} dikemas kini.`); }
}
function adminDeleteSection(code){
  const sec = SECTIONS.find(s=>s.code===code);
  if(!sec) return;
  showConfirmModal(`Padam bahagian <b>${sec.code}. ${sec.title}</b> beserta ${sec.items.length} item di dalamnya? Skor sedia ada bagi item-item ini pada semua rekod audit akan hilang daripada pengiraan dan paparan laporan. Tindakan ini tidak boleh dibatalkan.`, function(){
    const idx = SECTIONS.findIndex(s=>s.code===code);
    if(idx>-1) SECTIONS.splice(idx,1);
    const removedCodes = sec.items.map(([c])=>c);
    STATE.admin.criticalItems = STATE.admin.criticalItems.filter(c=>!removedCodes.includes(c));
    toast(`Bahagian ${sec.code} dan ${sec.items.length} item dipadam.`);
    renderAdmin();
  });
}
function adminAddItem(sectionCode){
  const input = document.getElementById('newItemText-'+sectionCode);
  const text = input.value.trim();
  if(!text){ toast('Sila masukkan teks item.'); return; }
  const sec = SECTIONS.find(s=>s.code===sectionCode);
  if(!sec) return;
  const code = nextItemCode(sectionCode);
  sec.items.push([code, text]);
  input.value = '';
  toast(`Item ${code} ditambah pada Bahagian ${sectionCode}.`);
  renderAdmin();
}
function adminUpdateItemText(sectionCode, itemCode, newText){
  const sec = SECTIONS.find(s=>s.code===sectionCode);
  if(!sec || !newText.trim()) return;
  const item = sec.items.find(i=>i[0]===itemCode);
  if(item){ item[1] = newText.trim(); toast(`Item ${itemCode} dikemas kini.`); }
}
function adminDeleteItem(sectionCode, itemCode){
  const sec = SECTIONS.find(s=>s.code===sectionCode);
  if(!sec) return;
  if(sec.items.length<=1){ toast('Bahagian mesti ada sekurang-kurangnya 1 item. Padam keseluruhan bahagian sebaliknya.'); return; }
  showConfirmModal(`Padam item <b>${itemCode}</b>? Skor sedia ada bagi item ini pada semua rekod audit akan hilang daripada pengiraan.`, function(){
    sec.items = sec.items.filter(i=>i[0]!==itemCode);
    STATE.admin.criticalItems = STATE.admin.criticalItems.filter(c=>c!==itemCode);
    toast(`Item ${itemCode} dipadam.`);
    renderAdmin();
  });
}

}

/* ============ SCORING ============ */
function computeScore(items){
  let sum=0, max=0;
  getAllCodes().forEach(c=>{
    const v = items[c] ? items[c].skor : null;
    if(v===null || v===undefined || v==='NA') return; // belum dijawab ATAU NA - tak dikira dalam skor
    max += 2;
    sum += Number(v);
  });
  const pct = max===0 ? 0 : (sum/max*100);
  let status='TIDAK MEMUASKAN', cls='red';
  if(pct>=90){status='CEMERLANG';cls='green';}
  else if(pct>=80){status='BAIK';cls='green';}
  else if(pct>=70){status='MEMUASKAN';cls='amber';}
  else if(pct>=50){status='PERLU PENAMBAHBAIKAN';cls='amber';}
  else {status='TIDAK MEMUASKAN';cls='red';}
  return {sum,max,pct,status,cls};
}
function countUnanswered(items){
  return getAllCodes().filter(c => !items[c] || items[c].skor===null || items[c].skor===undefined).length;
}
function hasCriticalFail(items){
  return STATE.admin.criticalItems.some(c => items[c] && items[c].skor==='0');
}
function fmtDate(dt){
  if(!dt) return '-';
  const d = new Date(dt);
  if(isNaN(d)) return dt;
  return d.toLocaleString('ms-MY', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function filterAuditTable(){
  const q = document.getElementById('auditSearchBox').value.trim().toLowerCase();
  const rows = document.querySelectorAll('#auditTableBody tr');
  let visibleCount = 0;
  rows.forEach(tr=>{
    const match = !q || (tr.dataset.search||'').includes(q);
    tr.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const emptyMsg = document.getElementById('auditSearchEmpty');
  if(emptyMsg) emptyMsg.style.display = (q && visibleCount===0) ? 'block' : 'none';
}

function renderExportSubfilter(){
  const scope = document.getElementById('exportScope').value;
  const wrap = document.getElementById('exportSubfilterWrap');
  const hint = document.getElementById('exportScopeHint');
  if(scope==='kampus'){
    wrap.innerHTML = `<label class="field-label">Pilih Kampus</label>
      <select id="exportKampus">
        <option>Kampus Teknologi</option>
        <option>Kampus Induk</option>
      </select>`;
    hint.textContent = 'Jana satu dokumen merangkumi semua makmal dalam kampus dipilih.';
  } else if(scope==='makmal'){
    wrap.innerHTML = `<label class="field-label">Pilih Makmal</label>
      <select id="exportMakmal">
        ${STATE.audits.filter(a=>a.statusRekod!=='Draf').map(a=>`<option value="${a.id}">${a.namaMakmal} — ${a.kampus}</option>`).join('')}
      </select>`;
    hint.textContent = 'Sama seperti "Jana Dokumen" bagi satu makmal.';
  } else {
    wrap.innerHTML = '';
    hint.textContent = `Merangkumi kesemua ${STATE.audits.filter(a=>a.statusRekod!=='Draf').length} rekod audit selesai, kedua-dua kampus.`;
  }
}

function generateBulkDocument(){
  const scope = document.getElementById('exportScope').value;
  const format = document.getElementById('exportFormat').value;
  let list = STATE.audits.filter(a=>a.statusRekod!=='Draf' && a.sesiId===dashboardFocusSessionId());
  let scopeLabel = 'Semua Makmal (Kedua-dua Kampus)';
  if(scope==='kampus'){
    const k = document.getElementById('exportKampus').value;
    list = list.filter(a=>a.kampus===k);
    scopeLabel = k;
  } else if(scope==='makmal'){
    const id = document.getElementById('exportMakmal').value;
    return generateDocument(id, format); // guna dokumen terperinci sedia ada bagi 1 makmal
  }
  if(!list.length){ toast('Tiada rekod audit selesai untuk skop ini.'); return; }

  if(format==='excel'){
    const rows = [['Makmal','Kampus','Lokasi','Tarikh Audit','Auditor','PIC Makmal','Skor %','Status','Bil. NC','Bil. OFI']];
    list.forEach(a=>{
      const s = computeScore(a.items);
      rows.push([a.namaMakmal, a.kampus, a.lokasi, fmtDate(a.tarikh), a.auditor, a.pic||'-', Number(s.pct.toFixed(1)), s.status, a.nc.length, a.ofi.length]);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:26},{wch:16},{wch:16},{wch:16},{wch:20},{wch:20},{wch:9},{wch:22},{wch:8},{wch:8}];
    XLSX.utils.book_append_sheet(wb, ws, 'Laporan Pukal');
    XLSX.writeFile(wb, `Laporan_Pukal_${scopeLabel.replace(/\s+/g,'_')}.xlsx`);
    toast(`Fail Excel pukal (${scopeLabel}) dijana & dimuat turun.`);
    return;
  }

  const rows = list.map(a=>{
    const s = computeScore(a.items);
    return `<tr>
      <td>${a.namaMakmal}</td><td>${a.kampus}</td><td>${a.lokasi}</td>
      <td>${fmtDate(a.tarikh)}</td><td>${a.auditor}</td><td>${a.pic||'-'}</td>
      <td class="c">${s.pct.toFixed(1)}%</td><td class="c">${s.status}</td>
      <td class="c">${a.nc.length}</td><td class="c">${a.ofi.length}</td>
    </tr>`;
  }).join('');
  const overallAvg = list.reduce((s,a)=>s+computeScore(a.items).pct,0)/list.length;
  const critTotal = list.filter(a=>hasCriticalFail(a.items)).length;

  const doc = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><title>Laporan Pukal Audit OSH — ${scopeLabel}</title>
  <style>
    body{font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;max-width:980px;margin:30px auto;padding:0 20px;line-height:1.5;}
    h1{font-size:19px;text-align:center;margin-bottom:2px;}
    h2{font-size:13px;color:#555;text-align:center;margin-top:0;font-weight:normal;}
    table{width:100%;border-collapse:collapse;font-size:11px;margin-top:18px;}
    th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
    td.c,th.c{text-align:center;}
    .meta{font-size:12.5px;margin:16px 0;text-align:center;color:#333;}
    @media print{ body{margin:0;} }
  </style></head><body>
  <h1>LAPORAN PUKAL AUDIT DALAMAN OSH — MAKMAL FTKE</h1>
  <h2>Skop: ${scopeLabel} · Dijana oleh Sistem Audit OSH FTKE · ${fmtDate(new Date().toISOString())}</h2>
  <div class="meta"><b>Jumlah Makmal Direkod:</b> ${list.length} &nbsp;|&nbsp; <b>Purata Pematuhan:</b> ${overallAvg.toFixed(1)}% &nbsp;|&nbsp; <b>Makmal Ada KKP Kritikal:</b> ${critTotal}</div>
  <table>
    <thead><tr><th>Makmal</th><th>Kampus</th><th>Lokasi</th><th>Tarikh Audit</th><th>Auditor</th><th>PIC Makmal</th><th class="c">Skor</th><th class="c">Status</th><th class="c">Bil. NC</th><th class="c">Bil. OFI</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </body></html>`;

  if(format==='word'){
    const blob = new Blob(['\ufeff'+doc], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Laporan_Pukal_${scopeLabel.replace(/\s+/g,'_')}.doc`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);

function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function buildBarChartSvg(rows, opts){
  // rows: [{nama, value, color}], opts: {maxValue, valueSuffix, chartWidth}
  const barHeight = 24, gap = 10, leftPad = 230, rightPad = 60, topPad = 34;
  const chartWidth = opts.chartWidth || 460;
  const maxValue = opts.maxValue;
  const svgHeight = topPad + rows.length*(barHeight+gap) + 20;
  const svgWidth = leftPad + chartWidth + rightPad;

  let gridLines = '';
  const steps = opts.gridSteps || [0, maxValue*0.25, maxValue*0.5, maxValue*0.75, maxValue];
  steps.forEach(v=>{
    const x = leftPad + (maxValue>0 ? (v/maxValue)*chartWidth : 0);
    gridLines += `<line x1="${x}" y1="${topPad-10}" x2="${x}" y2="${svgHeight-14}" stroke="#e2ddd0" stroke-width="1"></line>
      <text x="${x}" y="${topPad-16}" text-anchor="middle" font-size="10" fill="#999" font-family="Arial">${Math.round(v*10)/10}${opts.valueSuffix||''}</text>`;
  });

  let bars = '';
  rows.forEach((r,i)=>{
    const y = topPad + i*(barHeight+gap);
    const barW = maxValue>0 ? Math.max(2, (r.value/maxValue)*chartWidth) : 2;
    bars += `
      <text x="${leftPad-10}" y="${y+barHeight/2+5}" text-anchor="end" font-size="12" font-family="Arial" fill="#1E2A33">${escapeXml(r.nama.length>28?r.nama.slice(0,26)+'…':r.nama)}</text>
      <rect x="${leftPad}" y="${y}" width="${barW}" height="${barHeight}" fill="${r.color}" rx="3"></rect>
      <text x="${leftPad+barW+8}" y="${y+barHeight/2+5}" font-size="12" font-family="Arial" fill="#333" font-weight="bold">${r.value}${opts.valueSuffix||''}</text>
    `;
  });

  return `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:${svgWidth}px;">
    ${gridLines}
    ${bars}
  </svg>`;
}

function generateScoreGraph(){
  const scope = document.getElementById('graphScope').value;
  const order = document.getElementById('graphOrder').value;
  const showPct = document.getElementById('graphMetricPct').checked;
  const showKrit = document.getElementById('graphMetricKrit').checked;
  const showNcr = document.getElementById('graphMetricNcr').checked;
  const showOfi = document.getElementById('graphMetricOfi').checked;
  if(!showPct && !showKrit && !showNcr && !showOfi){ toast('Sila tandakan sekurang-kurangnya satu metrik untuk dipaparkan.'); return; }

  const focusSessionId = dashboardFocusSessionId();
  let list = STATE.audits.filter(a=>a.statusRekod!=='Draf' && a.sesiId===focusSessionId);
  if(scope!=='Semua') list = list.filter(a=>a.kampus===scope);
  if(!list.length){ toast('Tiada rekod audit untuk skop ini.'); return; }

  const statusColorMap = {CEMERLANG:'#1B7A3D',BAIK:'#8FBC3F',MEMUASKAN:'#E0A82E','PERLU PENAMBAHBAIKAN':'#D9722E','TIDAK MEMUASKAN':'#C0392B'};
  const base = list.map(a=>{
    const s = computeScore(a.items);
    const kritCount = STATE.admin.criticalItems.filter(c=>a.items[c].skor==='0').length;
    return {nama:a.namaMakmal, kampus:a.kampus, pct:s.pct, status:s.status, kritikal:kritCount, ncr:a.nc.length, ofi:a.ofi.length};
  });

  // Susun ikut metrik utama: keutamaan %Markah > Kritikal > NCR > OFI (metrik pertama yang ditandakan)
  const sortKey = showPct ? 'pct' : showKrit ? 'kritikal' : showNcr ? 'ncr' : 'ofi';
  const sorted = [...base].sort((x,y)=> order==='asc' ? x[sortKey]-y[sortKey] : y[sortKey]-x[sortKey]);

  let sections = '';
  if(showPct){
    const rows = sorted.map(r=>({nama:r.nama, value:Number(r.pct.toFixed(1)), color: statusColorMap[r.status]||'#888'}));
    sections += `<h2 class="chartTitle">% Markah Pematuhan</h2>` + buildBarChartSvg(rows, {maxValue:100, valueSuffix:'%'});
  }
  if(showKrit){
    const rows = sorted.map(r=>({nama:r.nama, value:r.kritikal, color:'#C0392B'}));
    const maxV = Math.max(1, ...rows.map(r=>r.value));
    sections += `<h2 class="chartTitle">Bilangan Item Kritikal Gagal</h2>` + buildBarChartSvg(rows, {maxValue:maxV});
  }
  if(showNcr){
    const rows = sorted.map(r=>({nama:r.nama, value:r.ncr, color:'#D9722E'}));
    const maxV = Math.max(1, ...rows.map(r=>r.value));
    sections += `<h2 class="chartTitle">Bilangan NCR</h2>` + buildBarChartSvg(rows, {maxValue:maxV});
  }
  if(showOfi){
    const rows = sorted.map(r=>({nama:r.nama, value:r.ofi, color:'#2C5C86'}));
    const maxV = Math.max(1, ...rows.map(r=>r.value));
    sections += `<h2 class="chartTitle">Bilangan OFI</h2>` + buildBarChartSvg(rows, {maxValue:maxV});
  }

  const scopeLabel = scope==='Semua' ? 'Semua Kampus' : scope;
  const orderLabel = order==='asc' ? 'Menaik (Terendah ke Tertinggi)' : 'Menurun (Tertinggi ke Terendah)';
  const focusSess = STATE.sessions.find(s=>s.id===focusSessionId);
  const metricLabels = [showPct&&'% Markah', showKrit&&'Kritikal', showNcr&&'NCR', showOfi&&'OFI'].filter(Boolean).join(', ');

  const doc = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><title>Graf Makmal — ${scopeLabel}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;max-width:900px;margin:30px auto;padding:0 20px;}
    h1{font-size:19px;text-align:center;margin-bottom:2px;}
    h2.pageHead{font-size:13px;color:#555;text-align:center;margin-top:0;font-weight:normal;}
    h2.chartTitle{font-size:14px;color:#10243E;margin:26px 0 4px;border-bottom:1px solid #ddd;padding-bottom:4px;}
    .legend{display:flex;gap:18px;justify-content:center;margin:16px 0 6px;font-size:12px;flex-wrap:wrap;}
    .legend span{display:inline-flex;align-items:center;gap:6px;}
    .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
    .chartwrap{overflow-x:auto;margin-top:6px;}
    @media print{ body{margin:0;} }
  </style></head><body>
  <h1>GRAF MAKMAL — MAKMAL FTKE</h1>
  <h2 class="pageHead">Skop: ${scopeLabel} · Metrik: ${metricLabels} · Susunan: ${orderLabel} · ${focusSess?focusSess.nama:'-'} · Dijana ${fmtDate(new Date().toISOString())}</h2>
  ${showPct ? `<div class="legend">
    <span><i style="background:#1B7A3D;"></i> Cemerlang (≥90%)</span>
    <span><i style="background:#8FBC3F;"></i> Baik (≥80%)</span>
    <span><i style="background:#E0A82E;"></i> Memuaskan (≥70%)</span>
    <span><i style="background:#D9722E;"></i> Perlu Penambahbaikan (≥50%)</span>
    <span><i style="background:#C0392B;"></i> Tidak Memuaskan (&lt;50%)</span>
  </div>` : ''}
  <div class="chartwrap">${sections}</div>
  </body></html>`;

  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Graf_Makmal_${scopeLabel.replace(/\s+/g,'_')}_${order}.html`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast(`Graf makmal (${scopeLabel}, ${metricLabels}) dijana & dimuat turun.`);
}
async function generateNcOfiReport(){

    const headerKrit = ['Bil','Makmal','Kampus','Auditor','Tarikh Audit','Kod Item Kritikal','Item Audit','Catatan'];

        else if(type==='ofi') rows.push([i+1, e.makmal, e.kampus, e.seksyen, e.teksSeksyen, e.cadangan, e.adaGambar?'Ya':'Tiada']);

function deleteAuditRecord(id){
  const a = STATE.audits.find(x=>x.id===id);
  if(!a) return;
  const sess = STATE.sessions.find(x=>x.id===a.sesiId);
  const isOwner = a.emailAuditor === currentUser.email;
  const canManage = isAdmin() || (isOwner && !(sess && sess.status==='Selesai'));
  if(!canManage){
    toast('Sesi audit ini telah ditutup — pemarkahan tidak boleh dipadam lagi.');
    return;
  }
  showConfirmModal(`Padam pemarkahan <b>"${a.namaMakmal}"</b>? Semua data checklist, NC dan OFI berkaitan akan turut dipadam. Tindakan ini tidak boleh dibatalkan.`, async function(){
    const res = await apiCall('deleteAudit', { id });
    if(!res.ok) return;
    STATE.audits = STATE.audits.filter(x=>x.id!==id);
    toast(`Pemarkahan "${a.namaMakmal}" telah dipadam.`);
    nav('dashboard');
  }, {confirmLabel:'🗑 Ya, Padam'});
}

function generateActionPlan(){
  const scope = document.getElementById('planScope').value;
  const format = document.getElementById('planFormat').value;
  const focusSessionId = dashboardFocusSessionId ? dashboardFocusSessionId() : STATE.activeSessionId;
  let list = STATE.audits.filter(a=>a.statusRekod!=='Draf' && a.sesiId===focusSessionId);
  let scopeLabel = 'Semua Makmal';
  if(scope==='Kampus'){
    const k = document.getElementById('planKampus').value;
    list = list.filter(a=>a.kampus===k);
    scopeLabel = k;
  } else if(scope==='Makmal'){
    const id = document.getElementById('planMakmal').value;
    list = list.filter(a=>String(a.id)===String(id));
    scopeLabel = list.length ? list[0].namaMakmal : 'Makmal';
  }
  if(!list.length){ toast('Tiada rekod audit untuk skop ini.'); return; }

  // Kumpulkan NCR + Item Kritikal gagal merentasi makmal dalam skop
  const entries = [];
  list.forEach(a=>{
    a.nc.forEach((n,i)=> entries.push({
      jenis:'NCR', makmal:a.namaMakmal, kampus:a.kampus, seksyen:n.seksyen, teksSeksyen:itemText(n.seksyen),
      perincian: n.penemuan||'', cadangan: n.tindakan||''
    }));
    STATE.admin.criticalItems.forEach(kod=>{
      const it = a.items[kod];
      if(it && it.skor==='0'){
        entries.push({
          jenis:'Kritikal', makmal:a.namaMakmal, kampus:a.kampus, seksyen:kod, teksSeksyen:itemText(kod),
          perincian: it.catatan||'(Item kritikal gagal - skor 0)', cadangan:''
        });
      }
    });
  });
  if(!entries.length){ toast('Tiada NCR atau Item Kritikal gagal untuk skop ini — tiada Pelan Tindakan diperlukan.'); return; }

  if(format==='excel'){
    const rows = [['Bil','Jenis','Makmal','Kampus','Seksyen','Item Seksyen','Perincian Penemuan','Cadangan Tindakan','Status Tindakan','Tarikh Sasaran Pembetulan']];
    entries.forEach((e,i)=> rows.push([i+1, e.jenis, e.makmal, e.kampus, e.seksyen, e.teksSeksyen, e.perincian, e.cadangan, '', '']));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:5},{wch:10},{wch:22},{wch:15},{wch:8},{wch:32},{wch:32},{wch:28},{wch:16},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws, 'Pelan Tindakan');
    XLSX.writeFile(wb, `Pelan_Tindakan_${scopeLabel.replace(/\s+/g,'_')}.xlsx`);
    toast(`Fail Excel Pelan Tindakan (${scopeLabel}) dijana & dimuat turun.`);
    return;
  }

  const rows = entries.map((e,i)=>`
    <tr>
      <td class="c">${i+1}</td>
      <td class="c" style="font-weight:bold;color:${e.jenis==='Kritikal'?'#B23A2E':'#C97A2B'};">${e.jenis}</td>
      <td>${e.makmal}</td><td>${e.kampus}</td><td class="c">${e.seksyen}</td><td>${e.teksSeksyen}</td>
      <td>${e.perincian}</td><td>${e.cadangan||'-'}</td>
      <td style="min-width:110px;">&nbsp;</td><td style="min-width:100px;">&nbsp;</td>
    </tr>`).join('');
  const focusSess = STATE.sessions.find(s=>s.id===focusSessionId);
  const doc = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><title>Pelan Tindakan — ${scopeLabel}</title>
  <style>
    body{font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;max-width:1100px;margin:30px auto;padding:0 20px;line-height:1.5;}
    h1{font-size:19px;text-align:center;margin-bottom:2px;}
    h2{font-size:13px;color:#555;text-align:center;margin-top:0;font-weight:normal;}
    table{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:18px;}
    th,td{border:1px solid #ccc;padding:6px 7px;text-align:left;vertical-align:top;}
    td.c,th.c{text-align:center;}
    th{background:#F0EEE6;}
    .meta{font-size:12.5px;margin:16px 0;text-align:center;color:#333;}
    @media print{ body{margin:0;} }
  </style></head><body>
  <h1>PELAN TINDAKAN — AUDIT OSH MAKMAL FTKE</h1>
  <h2>Skop: ${scopeLabel} · ${focusSess?focusSess.nama:'-'} · Dijana ${fmtDate(new Date().toISOString())}</h2>
  <div class="meta"><b>Jumlah Item:</b> ${entries.length} (NCR: ${entries.filter(e=>e.jenis==='NCR').length}, Kritikal: ${entries.filter(e=>e.jenis==='Kritikal').length})</div>
  <table>
    <thead><tr><th class="c">Bil</th><th class="c">Jenis</th><th>Makmal</th><th>Kampus</th><th class="c">Seksyen</th><th>Item Seksyen</th><th>Perincian Penemuan</th><th>Cadangan Tindakan</th><th>Status Tindakan</th><th>Tarikh Sasaran</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </body></html>`;

  const blob = new Blob(['\ufeff'+doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Pelan_Tindakan_${scopeLabel.replace(/\s+/g,'_')}.doc`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast(`Dokumen Word Pelan Tindakan (${scopeLabel}) dijana & dimuat turun.`);
}

function downloadBackupCsv(){
  const headers = ['ID','Sesi','Kampus','Nama Makmal','Lokasi','Tarikh','Auditor','E-mel Auditor','PIC','Status','Skor %','Bil NCR','Bil OFI'];
  const rows = [headers];
  STATE.audits.forEach(a=>{
    const s = computeScore(a.items);
    rows.push([a.id, sessionName(a.sesiId), a.kampus, a.namaMakmal||'', a.lokasi||'', a.tarikh||'', a.auditor||'', a.emailAuditor||'', a.pic||'', a.statusRekod, a.statusRekod==='Draf'?'':s.pct.toFixed(1), (a.nc||[]).length, (a.ofi||[]).length]);
  });
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `Sandaran_Audit_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  toast('Fail CSV audit dimuat turun.');
}
function generateComplianceAnalysis(){
  const format = document.getElementById('analysisFormat').value;
  const completed = STATE.audits.filter(a=>a.statusRekod==='Selesai');
  if(!completed.length){ toast('Tiada rekod audit "Selesai" untuk dianalisis.'); return; }

  // ===== 1. Item paling kerap gagal (skor 0/1) — 10 teratas =====
  const itemStats = {};
  getAllCodes().forEach(code=>{ itemStats[code] = {skor0:0, skor1:0}; });
  completed.forEach(a=>{
    getAllCodes().forEach(code=>{
      const it = a.items[code];
      if(!it || it.skor===null) return;
      if(it.skor==='0') itemStats[code].skor0++;
      else if(it.skor==='1') itemStats[code].skor1++;
    });
  });
  const itemRanked = getAllCodes().map(code=>({
    code, teks: itemText(code), skor0: itemStats[code].skor0, skor1: itemStats[code].skor1,
    jumlah: itemStats[code].skor0 + itemStats[code].skor1,
    peratus: (((itemStats[code].skor0 + itemStats[code].skor1) / completed.length) * 100).toFixed(1)
  })).sort((a,b)=> b.jumlah - a.jumlah).slice(0, 10).filter(x=>x.jumlah>0);

  // ===== 2. Trend antara sesi =====
  const sessionStats = {};
  completed.forEach(a=>{
    const s = computeScore(a.items);
    if(!sessionStats[a.sesiId]) sessionStats[a.sesiId] = {sum:0, count:0};
    sessionStats[a.sesiId].sum += s.pct;
    sessionStats[a.sesiId].count++;
  });
  const sessionTrend = STATE.sessions
    .filter(s=> sessionStats[s.id])
    .map(s=>({ nama:s.nama, tarikhMula:s.tarikhMula, purata:(sessionStats[s.id].sum/sessionStats[s.id].count).toFixed(1), jumlahAudit:sessionStats[s.id].count }))
    .sort((a,b)=> (a.tarikhMula||'').localeCompare(b.tarikhMula||''));

  // ===== 3. Perbandingan kampus =====
  const campusStats = {};
  completed.forEach(a=>{
    const s = computeScore(a.items);
    if(!campusStats[a.kampus]) campusStats[a.kampus] = {sum:0, count:0};
    campusStats[a.kampus].sum += s.pct;
    campusStats[a.kampus].count++;
  });
  const campusCompare = Object.entries(campusStats).map(([kampus,v])=>({ kampus, purata:(v.sum/v.count).toFixed(1), jumlahAudit:v.count }));

  // ===== 4. Bahagian paling lemah (purata skor % setiap bahagian A-G) =====
  const sectionStats = SECTIONS.map(sec=>{
    let sum=0, max=0;
    completed.forEach(a=>{
      sec.items.forEach(([code])=>{
        const it = a.items[code];
        if(it && it.skor!==null && it.skor!=='NA'){ sum += Number(it.skor); max += 2; }
      });
    });
    return { kod:sec.code, tajuk:sec.title, peratus: max>0 ? ((sum/max)*100).toFixed(1) : '0.0' };
  }).sort((a,b)=> Number(a.peratus) - Number(b.peratus));

  const dijana = fmtDate(new Date().toISOString());

  if(format==='html'){
    const doc = buildAnalysisHtml(itemRanked, sessionTrend, campusCompare, sectionStats, dijana, completed.length);
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `Analisis_Pematuhan_${dijana.replace(/\s+/g,'_')}.html`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    toast('Laporan Analisis Pematuhan dijana & dimuat turun.');
    return;
  }
  const doc = buildAnalysisHtml(itemRanked, sessionTrend, campusCompare, sectionStats, dijana, completed.length);
  const blob = new Blob(['\ufeff'+doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `Analisis_Pematuhan_${dijana.replace(/\s+/g,'_')}.doc`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  toast('Dokumen Word Analisis Pematuhan dijana & dimuat turun.');
}

  </style></head><body>
  <h1>ANALISIS PEMATUHAN — AUDIT OSH MAKMAL FTKE</h1>
  <h2 class="sub">Merentasi semua sesi · ${jumlahAudit} audit "Selesai" · Dijana ${dijana}</h2>

  <h2 class="section">1. Item Paling Kerap Gagal (10 Teratas)</h2>

    <tbody>${itemRows || '<tr><td colspan="7" class="c">Tiada item gagal direkodkan.</td></tr>'}</tbody>

function b1LoadForEdit(id){
  const a = STATE.audits.find(x=>String(x.id)===String(id));
  if(!a) return;
  const sess = STATE.sessions.find(x=>x.id===a.sesiId);
  const sessionClosed = sess && sess.status==='Selesai';
  if(!isAdmin() && a.emailAuditor !== currentUser.email){
    toast('Anda hanya boleh edit audit yang anda cipta sendiri.'); return;
  }
  if(!isAdmin() && sessionClosed){
    toast('Sesi audit ini telah ditandakan selesai — hanya papar sahaja dibenarkan.'); return;
  }
  b1 = freshB1();
  b1.editingId = a.id;
  b1.general = {kampus:a.kampus, namaMakmal:a.namaMakmal, lokasi:a.lokasi, tarikh:a.tarikh, auditor:a.auditor, pic:a.pic};
  b1.items = JSON.parse(JSON.stringify(a.items));
  b1.step = 0;
  document.getElementById('auditDetailModalHost') && (document.getElementById('auditDetailModalHost').innerHTML = '');

function b1SectionComplete(idx){
  if(idx===0){
    return !!(b1.general.namaMakmal && b1.general.lokasi && b1.general.auditor);
  }
  if(idx>=1 && idx<=SECTIONS.length){
    const sec = SECTIONS[idx-1];
    return sec.items.every(([code])=> b1.items[code] && b1.items[code].skor!==null);
  }
  return false;
}
function b1QuickFillSection(sectionCode, skorValue){
  const sec = SECTIONS.find(s=>s.code===sectionCode);
  if(!sec) return;
  sec.items.forEach(([code])=>{ b1.items[code].skor = skorValue; });
  renderBorang1();
  toast(`Semua item Bahagian ${sectionCode} ditandakan "${skorValue==='2'?'Patuh':skorValue==='1'?'Perlu Penambahbaikan':skorValue==='0'?'Tidak Patuh':'NA'}". Boleh edit semula item tertentu jika perlu.`);
}
function renderBorang1(){
  if(!b1) b1 = freshB1();
  const steps = ['Maklumat Am', ...SECTIONS.map(s=>s.code), 'Semakan'];

    const cls = i===b1.step ? 'active' : (b1SectionComplete(i) ? 'done' : '');

    return `<div class="rail-step ${cls}" onclick="b1GoStep(${i})"><span class="dot">${dotLabel}</span>${i===0?'Maklumat Am': i===steps.length-1 ? 'Semakan' : 'Bhg. '+label}</div>${i<steps.length-1?'<span class="rail-arrow">›</span>':''}`;
  }).join('');

  let body = '';
  if(b1.step===0){

        </div>
        <div class="field">
          <label class="field-label">Nama Makmal</label>
          <input type="text" value="${b1.general.namaMakmal}" oninput="b1.general.namaMakmal=this.value" placeholder="cth. Makmal Elektronik Kuasa">
        </div>
        <div class="field">
          <label class="field-label">Lokasi Makmal</label>
          <input type="text" value="${b1.general.lokasi}" oninput="b1.general.lokasi=this.value" placeholder="cth. Blok E, Aras 1">
        </div>
        <div class="field">
          <label class="field-label">Tarikh & Masa Audit</label>
          <input type="datetime-local" value="${b1.general.tarikh}" oninput="b1.general.tarikh=this.value">
        </div>
        <div class="field">
          <label class="field-label">Nama Auditor</label>
          <input type="text" value="${b1.general.auditor}" oninput="b1.general.auditor=this.value">
        </div>
        <div class="field">
          <label class="field-label">Nama PIC Makmal</label>
          <input type="text" value="${b1.general.pic}" oninput="b1.general.pic=this.value">
        </div>
      </div>`;
  } else if(b1.step>=1 && b1.step<=SECTIONS.length){
    const sec = SECTIONS[b1.step-1];
    const answeredInSec = sec.items.filter(([code])=>b1.items[code].skor!==null).length;
    body = `<div class="flex-between" style="margin-bottom:14px;">
        <div class="display" style="font-size:15px;font-weight:600;color:var(--ink);">${sec.code}. ${sec.title}</div>
        <span class="badge ${answeredInSec===sec.items.length?'green':'amber'}">${answeredInSec}/${sec.items.length} dijawab</span>
      </div>
      <div class="callout" style="margin-bottom:14px;font-size:12.5px;">
        ⚡ Isi cepat (tandakan semua item bahagian ini sekaligus — boleh edit semula item individu selepas itu):
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn sm" onclick="b1QuickFillSection('${sec.code}','2')">✓ Semua Patuh (2)</button>
          <button class="btn sm" onclick="b1QuickFillSection('${sec.code}','1')">✓ Semua Perlu Penambahbaikan (1)</button>
          <button class="btn sm" onclick="b1QuickFillSection('${sec.code}','0')">✓ Semua Tidak Patuh (0)</button>
          <button class="btn sm" onclick="b1QuickFillSection('${sec.code}','NA')">✓ Semua NA</button>
        </div>
      </div>` +
      sec.items.map(([code,text])=>{
        const isCrit = STATE.admin.criticalItems.includes(code);
        const it = b1.items[code];
        const unanswered = it.skor===null;
        return `<div class="item-row ${isCrit?'crit':''}" style="${unanswered?'border-left:3px solid var(--amber);':''}">
          <div class="item-head">
            <span class="code-chip ${isCrit?'crit':''} lg">${code}</span>
            <div class="item-text">${text}${isCrit?' <span class="badge red" style="margin-left:6px;">Kritikal</span>':''}${unanswered?' <span class="badge amber" style="margin-left:6px;">Belum dijawab</span>':''}</div>
          </div>
          <div class="scale">
            ${['2','1','0','NA'].map(v=>`
              <label class="s${v.toLowerCase()}">
                <input type="radio" name="skor-${code}" value="${v}" ${it.skor===v?'checked':''} onchange="b1.items['${code}'].skor='${v}'; renderBorang1();">
                <span>${v==='2'?'2 · Patuh':v==='1'?'1 · Perlu Penambahbaikan':v==='0'?'0 · Tidak Patuh':'NA'}</span>

        </div>`;
      }).join('');
  } else {
    const s = computeScore(b1.items);
    const unansweredTotal = countUnanswered(b1.items);
    const crit = STATE.admin.criticalItems.filter(c=>b1.items[c].skor==='0');
    const incompleteSections = SECTIONS.map((sec,i)=>{
      const missing = sec.items.filter(([code])=> !b1.items[code] || b1.items[code].skor===null).length;
      return {sec, stepIdx:i+1, missing};
    }).filter(x=>x.missing>0);
    body = `
      <div class="callout ${(crit.length||unansweredTotal)?'warn':''}">
        <b>Rumusan Audit:</b> Jumlah skor ${s.sum} / ${s.max} — <b>${s.pct.toFixed(1)}%</b> — Status: <b>${s.status}</b>.
        ${crit.length ? `<br><b>Amaran:</b> ${crit.length} item kritikal bertanda "Tidak Patuh" (${crit.join(', ')}). Ini akan ditandakan sebagai KKP Kritikal.` : '<br>Tiada kegagalan pada item kritikal.'}
        ${unansweredTotal ? `<br><b>⚠ ${unansweredTotal} daripada ${getAllCodes().length} item masih belum dijawab.</b> Sila lengkapkan semua bahagian sebelum menghantar (atau guna "Simpan Draf" untuk sambung kemudian).` : ''}
      </div>
      ${incompleteSections.length ? `
      <div class="card" style="border:1.5px solid var(--amber);margin-bottom:16px;">
        <div style="font-weight:700;color:var(--amber);margin-bottom:10px;">📋 Bahagian belum lengkap — klik untuk terus ke bahagian berkenaan:</div>
        ${incompleteSections.map(x=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft);">
            <div><b>Bahagian ${x.sec.code}.</b> ${x.sec.title} <span class="badge amber" style="margin-left:6px;">${x.missing} item belum dijawab</span></div>
            <button class="btn sm" onclick="b1GoStep(${x.stepIdx})">Isi Sekarang →</button>
          </div>`).join('')}
      </div>` : ''}
      <div class="grid cols-2">
        <div class="card"><div class="stat-label">Makmal</div><div style="font-weight:600;">${b1.general.namaMakmal||'-'}</div><div class="stat-note">${b1.general.kampus} · ${b1.general.lokasi||'-'}</div></div>
        <div class="card"><div class="stat-label">Auditor / PIC</div><div style="font-weight:600;">${b1.general.auditor||'-'}</div><div class="stat-note">PIC: ${b1.general.pic||'-'}</div></div>
      </div>
      <div class="stat-note" style="margin-top:14px;">Semak semula bahagian dengan klik pada label bahagian di atas jika perlu pembetulan, atau hantar borang untuk simpan ke pangkalan data.</div>
    `;
  }

  document.getElementById('main').innerHTML = `
    <div class="topline">
      <div>
        <h1 class="h1">Borang 1 · Checklist Audit</h1>
        <div class="h1-sub">Isi mengikut bahagian — sistem akan mengira skor secara automatik</div>
      </div>
    </div>
    ${b1.editingId ? `<div class="callout warn" style="margin-bottom:16px;">✎ Anda sedang ${STATE.audits.find(a=>a.id===b1.editingId)?.statusRekod==='Draf' ? 'menyambung draf' : 'mengedit rekod yang telah dihantar'} bagi <b>${b1.general.namaMakmal||'makmal ini'}</b>. Perubahan akan mengemas kini rekod sedia ada, bukan cipta rekod baharu.</div>` : ''}
    <div class="rail">${railHtml}</div>
    <div class="card">${body}</div>
    <div class="wizard-foot">
      <button class="btn" ${b1.step===0?'disabled':''} onclick="b1Prev()">← Kembali</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="b1SaveDraft()">💾 Simpan Draf & Keluar</button>
        ${b1.step < steps.length-1
          ? `<button class="btn primary" onclick="b1Next()">Seterusnya →</button>`
          : `<button class="btn primary" ${countUnanswered(b1.items)?'disabled title="Lengkapkan semua item dahulu"':''} onclick="b1Submit()">✓ ${b1.editingId ? 'Kemas Kini & Hantar' : 'Hantar & Simpan Audit'}</button>`}

    </div>

function b1GoStep(i){ b1.step=i; renderBorang1(); }
function b1Next(){
  if(b1.step===0){
    if(!b1.general.namaMakmal || !b1.general.lokasi || !b1.general.auditor){
      toast('Sila lengkapkan Nama Makmal, Lokasi dan Auditor dahulu.'); return;
    }
  }
  b1.step++; renderBorang1();
}
function b1Prev(){ b1.step--; renderBorang1(); }
async function b1SaveDraft(){
  if(!b1.general.namaMakmal){
    toast('Sila isi sekurang-kurangnya Nama Makmal sebelum simpan draf.'); return;
  }
  if(!b1.editingId && !getActiveSession()){
    toast('Tiada sesi audit aktif — tidak boleh cipta audit baharu.'); return;
  }
  const payload = {
    kampus:b1.general.kampus, namaMakmal:b1.general.namaMakmal, lokasi:b1.general.lokasi,
    tarikh:b1.general.tarikh || new Date().toISOString(),
    auditor:b1.general.auditor || currentUser.nama, emailAuditor: currentUser.email, pic:b1.general.pic,
    items: b1.items, nc: [], ofi: [], statusRekod:'Draf'
  };
  if(b1.editingId){
    const existing = STATE.audits.find(a=>a.id===b1.editingId);
    const merged = {...existing, ...payload, sesiId: existing.sesiId};
    const res = await apiCall('saveAudit', { audit: {...merged, id:b1.editingId} });
    if(!res.ok) return;
    const idx = STATE.audits.findIndex(a=>a.id===b1.editingId);
    if(idx>-1) STATE.audits[idx] = merged;
  } else {
    const res = await apiCall('saveAudit', { audit: {sesiId:STATE.activeSessionId, ...payload} });
    if(!res.ok) return;
    STATE.audits.push({id:res.id, sesiId:STATE.activeSessionId, ...payload});
    b1.editingId = res.id;
  }
  toast('Draf disimpan. Sambung bila-bila masa dari Dashboard.');
  b1 = freshB1();
  nav('dashboard');
}
async function b1Submit(){
  if(!b1.editingId && !getActiveSession()){
    toast('Tiada sesi audit aktif — tidak boleh cipta audit baharu.'); return;
  }
  if(countUnanswered(b1.items) > 0){
    toast('Sila lengkapkan semua item sebelum menghantar. Guna "Simpan Draf" jika belum bersedia.'); return;
  }
  let id, isFreshCompletion, targetStatus;
  if(b1.editingId){
    const existing = STATE.audits.find(a=>a.id===b1.editingId);
    isFreshCompletion = existing && (existing.statusRekod==='Draf' || existing.statusRekod==='MenungguBorang2');
    targetStatus = (existing && existing.statusRekod==='Selesai') ? 'Selesai' : 'MenungguBorang2';
    const payload = {
      kampus:b1.general.kampus, namaMakmal:b1.general.namaMakmal, lokasi:b1.general.lokasi,
      tarikh:b1.general.tarikh || new Date().toISOString(), auditor:b1.general.auditor,
      emailAuditor: currentUser.email, pic:b1.general.pic,
      items: b1.items, statusRekod: targetStatus
    };
    id = b1.editingId;
    const merged = {...existing, ...payload, nc: existing.nc||[], ofi: existing.ofi||[]};
    const res = await apiCall('saveAudit', { audit: {...merged, id} });
    if(!res.ok) return;
    const idx = STATE.audits.findIndex(a=>a.id===id);
    if(idx>-1) STATE.audits[idx] = merged;
  } else {
    const payload = {
      kampus:b1.general.kampus, namaMakmal:b1.general.namaMakmal, lokasi:b1.general.lokasi,
      tarikh:b1.general.tarikh || new Date().toISOString(), auditor:b1.general.auditor,
      emailAuditor: currentUser.email, pic:b1.general.pic,
      items: b1.items, statusRekod:'MenungguBorang2'
    };
    const res = await apiCall('saveAudit', { audit: {sesiId:STATE.activeSessionId, nc:[], ofi:[], ...payload} });
    if(!res.ok) return;
    id = res.id;
    STATE.audits.push({id, sesiId:STATE.activeSessionId, nc:[], ofi:[], ...payload});
    isFreshCompletion = true;
  }
  toast(isFreshCompletion ? `Borang 1 disimpan. Sila lengkapkan & sahkan Borang 2 untuk selesaikan audit ini.` : `Pemarkahan "${b1.general.namaMakmal}" dikemas kini.`);
  b1 = freshB1();
  if(isFreshCompletion){
    b2 = freshB2();
    b2.auditId = id;
    nav('borang2');
  } else {
    nav('dashboard');
  }
}

/* ============ BANTUAN GAMBAR (untuk janaan Excel/Word) ============ */
function getImageNaturalSize(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => resolve({width: img.naturalWidth || 300, height: img.naturalHeight || 200});
    img.onerror = () => resolve({width: 300, height: 200}); // anggaran selamat jika gagal baca
    img.src = dataUrl;
  });
}
function fitWithinBox(natW, natH, maxW, maxH){
  // Kekalkan nisbah aspek, hadkan supaya tak melebihi maxW x maxH (piksel)
  let w = natW, h = natH;
  if(w > maxW){ h = h * (maxW / w); w = maxW; }
  if(h > maxH){ w = w * (maxH / h); h = maxH; }
  return {width: Math.round(w), height: Math.round(h)};
}
const MAX_IMG_W_PX = 566; // 5.9 inci @ 96dpi
const MAX_IMG_H_PX = 384; // 4 inci @ 96dpi

async function fetchImageAsBase64(url){
  // Worker backend kita sendiri set header CORS betul pada /image/ - jadi fetch silang-domain ni boleh dipercayai
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    const blob = await res.blob();
    return await new Promise((resolve)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}
async function resizeImageToFit(dataUrl, maxWidthPx, maxHeightPx){
  // Word tak selalu hormat CSS max-width/max-height pada gambar terbenam - jadi kecilkan
  // PIKSEL SEBENAR gambar (guna canvas) sebelum dibenamkan, supaya saiz fail sendiri memang kecil.
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => {
      const fitted = fitWithinBox(img.naturalWidth || maxWidthPx, img.naturalHeight || maxHeightPx, maxWidthPx, maxHeightPx);
      try{
        const canvas = document.createElement('canvas');
        canvas.width = fitted.width;
        canvas.height = fitted.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, fitted.width, fitted.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85)); // JPEG - saiz fail lebih kecil untuk dokumen
      }catch(e){ resolve(dataUrl); } // gagal proses - guna asal sahaja
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function imgMimeAndBase64(dataUrl){
  if(!dataUrl || !dataUrl.startsWith('data:') || dataUrl.indexOf(',')===-1) return null;
  const meta = dataUrl.slice(5, dataUrl.indexOf(';')); // "image/png"
  const base64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  return {mime: meta, base64};
}
function imgExtForExcel(dataUrl){
  const info = imgMimeAndBase64(dataUrl);
  if(!info) return 'png';
  if(info.mime.includes('jpeg') || info.mime.includes('jpg')) return 'jpeg';
  if(info.mime.includes('gif')) return 'gif';
  return 'png';
}
function buildMhtmlDocument(htmlBody, images){
  // images: [{cid, dataUrl}] - membina fail MHTML (multipart/related) supaya Word memaparkan gambar terbenam sebenar
  const boundary = 'mhtml-osh-' + Date.now();
  let out = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${boundary}"\r\n\r\n`;
  out += `--${boundary}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Location: report.html\r\n\r\n`;
  out += htmlBody + '\r\n\r\n';
  images.forEach(img=>{
    const info = imgMimeAndBase64(img.dataUrl);
    if(!info) return;
    out += `--${boundary}\r\nContent-Type: ${info.mime}\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <${img.cid}>\r\nContent-Location: ${img.cid}\r\n\r\n`;
    out += (info.base64.match(/.{1,76}/g)||[info.base64]).join('\r\n') + '\r\n\r\n';
  });
  out += `--${boundary}--`;
  return out;
}

      .ncblock{border:1px solid #ddd;border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;}
      .sig{margin-top:40px;display:flex;justify-content:space-between;font-size:12.5px;}
    </style></head><body>
    <h1>LAPORAN AUDIT DALAMAN OSH — MAKMAL FTKE</h1>

      <div><b>Kampus:</b> ${a.kampus} &nbsp; | &nbsp; <b>Makmal:</b> ${a.namaMakmal} &nbsp; | &nbsp; <b>Lokasi:</b> ${a.lokasi}</div>
      <div><b>Tarikh & Masa Audit:</b> ${fmtDate(a.tarikh)} &nbsp; | &nbsp; <b>Auditor:</b> ${a.auditor} &nbsp; | &nbsp; <b>PIC Makmal:</b> ${a.pic}</div>

      ${crit.length? `<div style="color:#B23A2E;"><b>⚠ KKP Kritikal:</b> ${crit.map(c=>c+' — '+itemText(c)).join('; ')}</div>` : ''}
    </div>
    <h2>BORANG 1 — CHECKLIST AUDIT</h2>
    ${sectionsHtml}
    <h2>BORANG 2 — BAHAGIAN 2: LAPORAN NC</h2>
    ${ncHtmlWord}
    <h2>BORANG 2 — BAHAGIAN 3: CADANGAN OFI</h2>
    ${ofiHtmlWord}
    <h2>PENGESAHAN</h2>
    <div class="sig">
      <div>Disediakan oleh (Auditor):<br><br>_____________________<br>${a.auditor}</div>
      <div>Diterima & Diakui oleh (PIC Makmal):<br><br>_____________________<br>${a.pic}</div>
    </div>
    </body></html>`;

    const mhtml = buildMhtmlDocument(docWord, wordImages);
    const blob = new Blob([mhtml], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Laporan_Audit_${a.namaMakmal.replace(/\s+/g,'_')}.doc`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    toast(wordImages.length ? `Dokumen Word dijana dengan ${wordImages.length} gambar terbenam.` : 'Dokumen Word dijana & dimuat turun.');
    return;
  }

  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Laporan_Audit_${a.namaMakmal.replace(/\s+/g,'_')}.html`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast('Dokumen dijana & dimuat turun. Buka fail untuk cetak/simpan sebagai PDF.');
}
